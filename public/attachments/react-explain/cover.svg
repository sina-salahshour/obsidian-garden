<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Current fibers peek out behind their work-in-progress records. -->
  <g stroke="var(--line-strong, #d4cec3)" stroke-width="2" stroke-dasharray="6 8">
    <rect x="339" y="76" width="156" height="72" rx="19"/>
    <rect x="125" y="230" width="138" height="76" rx="19"/>
    <rect x="332" y="221" width="170" height="94" rx="22"/>
    <rect x="573" y="230" width="138" height="76" rx="19"/>
  </g>

  <!-- The parent descends to its first child. Siblings point across the row. -->
  <g stroke="var(--subtle, #8d867b)" stroke-width="2.5">
    <path d="M374 163v10q0 25-25 25H199q-24 0-24 24v18m-7-8 7 8 7-8"/>
    <path d="M485 284h63m-8-7 8 7-8 7"/>
    <path d="M400 331v36m-7-8 7 8 7-8"/>
  </g>
  <!-- A return pointer from the last sibling leads back to the parent. -->
  <path d="M638 245v-68q0-49-49-49H484m8-7-8 7 8 7" stroke="var(--subtle, #8d867b)" stroke-width="2"/>
  <path d="M246 284h60m-8-7 8 7-8 7" stroke="var(--accent, #5e81ac)" stroke-width="2.5"/>

  <!-- Fiber records. The small register at the left carries the node's tag. -->
  <g fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)" stroke-width="2.5">
    <rect x="322" y="91" width="156" height="72" rx="19"/>
    <rect x="108" y="246" width="138" height="76" rx="19"/>
    <rect x="556" y="246" width="138" height="76" rx="19"/>
    <circle cx="400" cy="393" r="19"/>
  </g>
  <g stroke="var(--line-strong, #d4cec3)" stroke-width="2">
    <path d="M374 92v70M154 247v74M602 247v74"/>
  </g>
  <g stroke="var(--line-strong, #d4cec3)" stroke-width="8">
    <path d="M393 119h59m-59 16h35M174 276h47m-47 16h27M622 276h47m-47 16h28"/>
  </g>
  <g stroke="var(--subtle, #8d867b)" stroke-width="2.5">
    <circle cx="131" cy="284" r="7"/>
    <circle cx="579" cy="284" r="7"/>
  </g>
  <!-- A branching glyph identifies the parent record. -->
  <path d="M340 136v-16m0 12c0-8 14-3 14-13" stroke="var(--fg, #1f1d1a)" stroke-width="3"/>
  <g fill="var(--fg, #1f1d1a)">
    <circle cx="340" cy="137" r="3.5"/><circle cx="340" cy="118" r="3.5"/><circle cx="354" cy="118" r="3.5"/>
  </g>

  <!-- The render loop is visiting this fiber. Its child is the next level down. -->
  <rect x="315" y="237" width="170" height="94" rx="22" fill="var(--surface, #ffffff)"/>
  <g stroke="var(--accent, #5e81ac)">
    <rect x="315" y="237" width="170" height="94" rx="22" fill="var(--accent, #5e81ac)" fill-opacity=".12" stroke-width="2.5"/>
    <path d="M371 238v92" stroke-width="2" opacity=".55"/>
    <circle cx="343" cy="284" r="12" stroke-width="2.5"/>
    <path d="M391 274h65m-65 20h39" stroke-width="8"/>
  </g>
  <circle cx="343" cy="284" r="5" fill="var(--accent, #5e81ac)"/>
  <circle cx="400" cy="393" r="6" fill="var(--subtle, #8d867b)"/>
</svg>
