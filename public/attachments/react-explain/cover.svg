<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- React Internals: the work-in-progress fiber tree (child / sibling / return pointers) mid
       render, its alternate (current) tree drawn dashed behind. Colours are site tokens. -->
  <!-- current tree (alternate), offset behind -->
  <g stroke="var(--line-strong, #d4cec3)" stroke-width="2" stroke-dasharray="5 7">
    <rect x="367" y="48" width="104" height="48" rx="14"/>
    <rect x="367" y="156" width="104" height="48" rx="14"/>
    <rect x="217" y="266" width="104" height="48" rx="14"/>
    <rect x="367" y="266" width="104" height="48" rx="14"/>
    <rect x="517" y="266" width="104" height="48" rx="14"/>
    <path d="M419 96v60M419 204c0 34-150 28-150 62"/>
  </g>
  <!-- pointers: child (down), sibling (across), return (back up) -->
  <g stroke="var(--subtle, #8d867b)" stroke-width="2.5">
    <path d="M389 120v52M383 166l6 7 6-7"/>
    <path d="M389 228c0 34-150 26-150 58M233 280l6 7 6-6"/>
    <path d="M293 310h40M327 304l7 6-7 6"/>
    <path d="M443 310h40M477 304l7 6-7 6"/>
    <path d="M389 334v52M383 380l6 7 6-7"/>
  </g>
  <path d="M601 294c40-20 30-94-152-94M456 194l-7 6 7 6" stroke="var(--subtle, #8d867b)" stroke-width="2" stroke-dasharray="2 7" opacity=".9"/>
  <!-- fibers -->
  <g stroke="var(--subtle, #8d867b)" stroke-width="2.5" fill="var(--surface, #ffffff)">
    <rect x="337" y="72" width="104" height="48" rx="14"/>
    <rect x="337" y="180" width="104" height="48" rx="14"/>
    <rect x="187" y="286" width="104" height="48" rx="14"/>
    <rect x="487" y="286" width="104" height="48" rx="14" stroke="var(--line-strong, #d4cec3)"/>
    <rect x="337" y="392" width="104" height="48" rx="14" stroke="var(--line-strong, #d4cec3)"/>
  </g>
  <!-- the fiber being worked on -->
  <rect x="337" y="286" width="104" height="48" rx="14" fill="var(--surface, #ffffff)"/>
  <rect x="337" y="286" width="104" height="48" rx="14" fill="var(--accent, #6d4fd1)" fill-opacity=".12" stroke="var(--accent, #6d4fd1)" stroke-width="2.5"/>
  <!-- placeholder labels (no text) -->
  <g stroke-width="6">
    <path d="M361 96h44M361 204h56M211 310h36M511 310h48M361 416h40" stroke="var(--line-strong, #d4cec3)"/>
    <path d="M361 310h52" stroke="var(--accent, #6d4fd1)"/>
  </g>
  <circle cx="275" cy="310" r="5" fill="var(--subtle, #8d867b)"/>
</svg>
