<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- The root frame, nested layout and page share a persistent shell. -->
  <g fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)" stroke-width="2.5">
    <rect x="332" y="96" width="372" height="304" rx="24"/>
    <rect x="354" y="148" width="328" height="230" rx="18"/>
    <rect x="410" y="164" width="256" height="198" rx="14" stroke="var(--line-strong, #d4cec3)"/>
  </g>
  <path d="M356 122h14" stroke="var(--fg, #1f1d1a)" stroke-width="3"/>
  <path d="M382 122h44m220 0h31M372 172h17" stroke="var(--line-strong, #d4cec3)" stroke-width="8"/>
  <path d="M372 194h12m-12 20h16" stroke="var(--line, #e6e2da)" stroke-width="8"/>
  <path d="M431 189h87" stroke="var(--line-strong, #d4cec3)" stroke-width="8"/>
  <path d="M431 210h145" stroke="var(--line, #e6e2da)" stroke-width="8"/>

  <!-- The initial shell reserves room for one unresolved subtree. -->
  <rect x="452" y="244" width="194" height="98" rx="14" stroke="var(--accent, #5e81ac)" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- The server and its narrow divide from the browser. -->
  <path d="M270 142v212" stroke="var(--line-strong, #d4cec3)" stroke-width="2"/>
  <g fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)" stroke-width="2.5">
    <rect x="96" y="189" width="128" height="44" rx="15"/>
    <rect x="96" y="240" width="128" height="44" rx="15"/>
  </g>
  <path d="M117 211h28m-28 51h28" stroke="var(--line-strong, #d4cec3)" stroke-width="2"/>
  <circle cx="202" cy="211" r="4" fill="var(--line-strong, #d4cec3)"/>
  <circle cx="202" cy="262" r="4" fill="var(--accent, #5e81ac)"/>

  <!-- A single rendered fragment is arriving at the matching dashed slot. -->
  <path d="M224 262h45c30 0 30 42 60 42h58m-8-8 8 8-8 8" stroke="var(--accent, #5e81ac)" stroke-width="2.5"/>
  <rect x="400" y="255" width="194" height="98" rx="14" fill="var(--surface, #ffffff)"/>
  <rect x="400" y="255" width="194" height="98" rx="14" fill="var(--accent, #5e81ac)" fill-opacity=".12" stroke="var(--accent, #5e81ac)" stroke-width="2.5"/>
  <path d="M421 328h151" stroke="var(--accent, #5e81ac)" stroke-opacity=".32" stroke-width="2"/>
  <path d="M421 314c15 0 21-18 35-18 12 0 16 11 26 11 14 0 21-26 36-26 11 0 15 9 25 9 11 0 17-13 27-13" stroke="var(--accent, #5e81ac)" stroke-width="2.5"/>
  <circle cx="570" cy="277" r="4" fill="var(--accent, #5e81ac)"/>
</svg>
