<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Next.js in Practice: the server (left) streams into nested layouts (root layout > layout >
       page) across the server | client line, filling one Suspense boundary. Colours are site tokens. -->
  <!-- server -->
  <g stroke="var(--subtle, #8d867b)" stroke-width="2.5" fill="var(--surface, #ffffff)">
    <rect x="96" y="196" width="104" height="32" rx="10"/>
    <rect x="96" y="236" width="104" height="32" rx="10"/>
    <rect x="96" y="276" width="104" height="32" rx="10"/>
  </g>
  <g fill="var(--line-strong, #d4cec3)">
    <circle cx="180" cy="212" r="4.5"/>
    <circle cx="180" cy="292" r="4.5"/>
  </g>
  <circle cx="180" cy="252" r="4.5" fill="var(--accent, #6d4fd1)"/>
  <!-- server | client -->
  <path d="M244 84v332" stroke="var(--line-strong, #d4cec3)" stroke-width="2"/>
  <!-- root layout -->
  <rect x="284" y="84" width="420" height="332" rx="20" fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)" stroke-width="2.5"/>
  <path d="M284 128h420" stroke="var(--line-strong, #d4cec3)" stroke-width="2"/>
  <g fill="var(--line-strong, #d4cec3)">
    <circle cx="308" cy="106" r="5"/>
    <rect x="326" y="101" width="54" height="10" rx="5"/>
    <rect x="620" y="101" width="60" height="10" rx="5"/>
  </g>
  <!-- layout -->
  <rect x="304" y="148" width="380" height="248" rx="14" stroke="var(--subtle, #8d867b)" stroke-width="2.5"/>
  <g stroke="var(--line, #e6e2da)" stroke-width="8">
    <path d="M326 174h34M326 194h26M326 214h30"/>
  </g>
  <!-- page -->
  <rect x="380" y="164" width="288" height="216" rx="10" stroke="var(--subtle, #8d867b)" stroke-width="2.5"/>
  <path d="M402 190h120" stroke="var(--line-strong, #d4cec3)" stroke-width="10"/>
  <path d="M402 212h220M402 230h170" stroke="var(--line, #e6e2da)" stroke-width="8"/>
  <!-- Suspense boundary being streamed in -->
  <rect x="402" y="252" width="244" height="108" rx="10" fill="var(--accent, #6d4fd1)" fill-opacity=".06" stroke="var(--accent, #6d4fd1)" stroke-width="2" stroke-dasharray="7 7"/>
  <g stroke="var(--accent, #6d4fd1)" stroke-width="8">
    <path d="M424 280h150" stroke-opacity=".55"/>
    <path d="M424 302h196" stroke-opacity=".28"/>
    <path d="M424 324h120" stroke-opacity=".12"/>
  </g>
  <!-- the stream -->
  <path d="M208 252c86 0 64 52 140 52" stroke="var(--accent, #6d4fd1)" stroke-width="2.5"/>
  <path d="M356 304h30M379 297l8 7-8 7" stroke="var(--accent, #6d4fd1)" stroke-width="2.5"/>
  <circle cx="244" cy="262" r="5" fill="var(--accent, #6d4fd1)"/>
</svg>
