<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- An Add event schedules the next render. -->
  <g stroke="var(--accent, #5e81ac)" stroke-width="2.5">
    <path d="M633 338v6c0 31-19 47-50 47H220c-43 0-64-22-64-60v-34" stroke-dasharray="2 8"/>
    <path d="m148 305 8-9 8 9"/>
  </g>

  <!-- The current list, with a newly added item. -->
  <circle cx="156" cy="227" r="56" fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)" stroke-width="2.5"/>
  <path d="M140 227h32" stroke="var(--line-strong, #d4cec3)" stroke-width="2"/>
  <circle cx="140" cy="227" r="9" fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)" stroke-width="2"/>
  <circle cx="172" cy="227" r="10" fill="var(--accent, #5e81ac)"/>

  <!-- State feeds the component, which returns the list UI. -->
  <g stroke="var(--subtle, #8d867b)" stroke-width="2.5">
    <path d="M225 227h48m-8-7 8 7-8 7"/>
    <path d="M407 227h48m-8-7 8 7-8 7"/>
  </g>
  <rect x="288" y="175" width="106" height="104" rx="25" fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)" stroke-width="2.5"/>
  <path d="M326 202c-14 13-14 37 0 50m30-50c14 13 14 37 0 50" stroke="var(--fg, #1f1d1a)" stroke-width="3"/>
  <circle cx="341" cy="227" r="8" fill="var(--accent, #5e81ac)"/>

  <!-- The same item appears in the shopping list. -->
  <rect x="470" y="111" width="236" height="216" rx="22" fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)" stroke-width="2.5"/>
  <path d="M471 166h234" stroke="var(--line-strong, #d4cec3)" stroke-width="2"/>
  <path d="M494 139h79" stroke="var(--subtle, #8d867b)" stroke-width="8"/>
  <circle cx="511" cy="201" r="8" stroke="var(--subtle, #8d867b)" stroke-width="2"/>
  <path d="M537 201h82" stroke="var(--line-strong, #d4cec3)" stroke-width="8"/>
  <rect x="489" y="224" width="198" height="43" rx="15" fill="var(--accent, #5e81ac)" fill-opacity=".12"/>
  <circle cx="511" cy="245.5" r="9" fill="var(--accent, #5e81ac)"/>
  <path d="M537 245.5h56" stroke="var(--accent, #5e81ac)" stroke-width="8"/>

  <!-- An input and its Add control share the lower edge. -->
  <rect x="492" y="302" width="163" height="36" rx="18" fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)" stroke-width="2"/>
  <path d="M508 314v12" stroke="var(--line-strong, #d4cec3)" stroke-width="2"/>
  <path d="M612 304v32" stroke="var(--line-strong, #d4cec3)" stroke-width="2"/>
  <path d="M626 320h14m-7-7v14" stroke="var(--fg, #1f1d1a)" stroke-width="3"/>
</svg>
