<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- React vs Svelte: on the left, a state change re-renders a virtual tree that is diffed against the
       previous one, and the result is committed to the page; on the right, one piece of state is wired
       straight to the one element it changes. Same page frame on both sides. Colours are site tokens. -->

  <!-- marks: React's atom over its side, Svelte's mark over its side, in site tokens (not brand colours) -->
  <g transform="translate(250 82)" stroke="var(--muted, #625c53)" stroke-width="2.5">
    <ellipse rx="26" ry="10"/>
    <ellipse rx="26" ry="10" transform="rotate(60)"/>
    <ellipse rx="26" ry="10" transform="rotate(120)"/>
    <circle r="4.5" fill="var(--muted, #625c53)" stroke="none"/>
  </g>
  <g transform="translate(506.7 54) scale(.1818)">
    <path fill="var(--accent, #5e81ac)" d="M239.682 40.707C211.113-.182 154.69-12.301 113.895 13.69L42.247 59.356a82.198 82.198 0 0 0-37.135 55.056a86.566 86.566 0 0 0 8.536 55.576a82.425 82.425 0 0 0-12.296 30.719a87.596 87.596 0 0 0 14.964 66.244c28.574 40.893 84.997 53.007 125.787 27.016l71.648-45.664a82.182 82.182 0 0 0 37.135-55.057a86.601 86.601 0 0 0-8.53-55.577a82.409 82.409 0 0 0 12.29-30.718a87.573 87.573 0 0 0-14.963-66.244"/>
    <path fill="var(--surface, #ffffff)" d="M106.889 270.841c-23.102 6.007-47.497-3.036-61.103-22.648a52.685 52.685 0 0 1-9.003-39.85a49.978 49.978 0 0 1 1.713-6.693l1.35-4.115l3.671 2.697a92.447 92.447 0 0 0 28.036 14.007l2.663.808l-.245 2.659a16.067 16.067 0 0 0 2.89 10.656a17.143 17.143 0 0 0 18.397 6.828a15.786 15.786 0 0 0 4.403-1.935l71.67-45.672a14.922 14.922 0 0 0 6.734-9.977a15.923 15.923 0 0 0-2.713-12.011a17.156 17.156 0 0 0-18.404-6.832a15.78 15.78 0 0 0-4.396 1.933l-27.35 17.434a52.298 52.298 0 0 1-14.553 6.391c-23.101 6.007-47.497-3.036-61.101-22.649a52.681 52.681 0 0 1-9.004-39.849a49.428 49.428 0 0 1 22.34-33.114l71.664-45.677a52.218 52.218 0 0 1 14.563-6.398c23.101-6.007 47.497 3.036 61.101 22.648a52.685 52.685 0 0 1 9.004 39.85a50.559 50.559 0 0 1-1.713 6.692l-1.35 4.116l-3.67-2.693a92.373 92.373 0 0 0-28.037-14.013l-2.664-.809l.246-2.658a16.099 16.099 0 0 0-2.89-10.656a17.143 17.143 0 0 0-18.398-6.828a15.786 15.786 0 0 0-4.402 1.935l-71.67 45.674a14.898 14.898 0 0 0-6.73 9.975a15.9 15.9 0 0 0 2.709 12.012a17.156 17.156 0 0 0 18.404 6.832a15.841 15.841 0 0 0 4.402-1.935l27.345-17.427a52.147 52.147 0 0 1 14.552-6.397c23.101-6.006 47.497 3.037 61.102 22.65a52.681 52.681 0 0 1 9.003 39.848a49.453 49.453 0 0 1-22.34 33.12l-71.664 45.673a52.218 52.218 0 0 1-14.563 6.398"/>
  </g>

  <!-- divide -->
  <path d="M400 60v384" stroke="var(--line, #e6e2da)" stroke-width="2" stroke-dasharray="2 9"/>

  <!-- the two mechanisms, below their marks -->
  <g transform="translate(0 36)">
    <!-- React: previous tree (faint, dashed) and next tree, compared -->
    <g stroke-width="2.5">
      <g stroke="var(--line-strong, #d4cec3)" stroke-dasharray="6 8">
        <path d="M200 116 176 156M200 116 224 156"/>
      </g>
      <circle cx="200" cy="112" r="8" fill="var(--surface, #ffffff)" stroke="var(--line-strong, #d4cec3)" stroke-dasharray="4 5"/>
      <circle cx="174" cy="160" r="7" fill="var(--surface, #ffffff)" stroke="var(--line-strong, #d4cec3)" stroke-dasharray="4 5"/>
      <circle cx="226" cy="160" r="7" fill="var(--surface, #ffffff)" stroke="var(--line-strong, #d4cec3)" stroke-dasharray="4 5"/>

      <g stroke="var(--subtle, #8d867b)">
        <path d="M300 116 276 156M300 116 324 156"/>
      </g>
      <circle cx="300" cy="112" r="8" fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)"/>
      <circle cx="274" cy="160" r="7" fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)"/>
      <circle cx="326" cy="160" r="7" fill="var(--fg, #1f1d1a)" stroke="var(--fg, #1f1d1a)"/>

      <!-- diff -->
      <path d="M222 136h56" stroke="var(--subtle, #8d867b)" stroke-width="2" stroke-dasharray="2 8"/>

      <!-- commit -->
      <g stroke="var(--subtle, #8d867b)">
        <path d="M250 190v74M243 257l7 8 7-8"/>
      </g>
    </g>

    <!-- React: the page -->
    <rect x="160" y="290" width="180" height="120" rx="14" fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)" stroke-width="2.5"/>
    <g fill="var(--line, #e6e2da)">
      <rect x="184" y="341" width="118" height="10" rx="5"/>
      <rect x="184" y="368" width="104" height="10" rx="5"/>
    </g>
    <rect x="184" y="314" width="88" height="10" rx="5" fill="var(--fg, #1f1d1a)" fill-opacity=".35"/>

    <!-- Svelte: one piece of state, wired straight to its element -->
    <circle cx="530" cy="136" r="30" fill="var(--surface, #ffffff)"/>
    <circle cx="530" cy="136" r="30" fill="var(--accent, #5e81ac)" fill-opacity=".12" stroke="var(--accent, #5e81ac)" stroke-width="2.5"/>
    <circle cx="530" cy="136" r="9" fill="var(--accent, #5e81ac)"/>

    <!-- Svelte: the page -->
    <rect x="460" y="290" width="180" height="120" rx="14" fill="var(--surface, #ffffff)" stroke="var(--subtle, #8d867b)" stroke-width="2.5"/>
    <g fill="var(--line, #e6e2da)">
      <rect x="484" y="341" width="118" height="10" rx="5"/>
      <rect x="484" y="368" width="104" height="10" rx="5"/>
    </g>
    <rect x="484" y="314" width="88" height="10" rx="5" fill="var(--accent, #5e81ac)"/>
    <!-- the wire, drawn over the frame so it visibly reaches its element -->
    <path d="M530 168v140" stroke="var(--accent, #5e81ac)" stroke-width="2.5"/>
  </g>
</svg>
